[package]
name = "laboratorio-libvirt"
version = "0.2.0"
edition = "2021"
description = "Fábrica segura de máquinas virtuales efímeras Windows y Linux"
license = "GPL-3.0-or-later"

[dependencies]
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
http = "1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = { version = "0.5", features = ["util"] }
wait-timeout = "0.2"
xmltree = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
http-body-util = "0.1"
serde_yaml_ng = "0.10"
tempfile = "3.10"
