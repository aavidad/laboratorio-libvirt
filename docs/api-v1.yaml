openapi: 3.1.0
info:
  title: API de Laboratorio Libvirt
  version: 1.1.0
  license:
    name: GPL-3.0-or-later
    identifier: GPL-3.0-or-later
  description: >-
    Contrato tipado para administrar reservas efímeras sin exponer recursos
    internos de libvirt.
servers:
  - url: http://127.0.0.1:{puerto}
    description: Escucha local integrada
    variables:
      puerto:
        default: "8787"
security:
  - tokenPortador: []
paths:
  /api/v1/salud:
    get:
      operationId: consultarSalud
      summary: Comprueba la disponibilidad autenticada
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Salud"
        "401":
          $ref: "#/components/responses/NoAutorizado"
  /api/v1/plantillas:
    get:
      operationId: listarPlantillas
      summary: Lista el catálogo público de plantillas
      responses:
        "200":
          description: Plantillas registradas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaPlantillas"
        "401":
          $ref: "#/components/responses/NoAutorizado"
  /api/v1/destinos-promocion:
    get:
      operationId: listarDestinosPromocion
      summary: Lista destinos de promoción preautorizados
      responses:
        "200":
          description: Destinos públicos sin referencias del hipervisor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDestinosPromocion"
        "401":
          $ref: "#/components/responses/NoAutorizado"
  /api/v1/plantillas/{id}/diagnostico:
    get:
      operationId: inspeccionarPlantilla
      summary: Verifica las precondiciones de una plantilla
      parameters:
        - $ref: "#/components/parameters/IdPlantilla"
      responses:
        "200":
          description: Diagnóstico de la plantilla
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDiagnostico"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas:
    get:
      operationId: listarReservas
      summary: Lista los recibos persistidos
      responses:
        "200":
          description: Reservas ordenadas por identificador
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaReservas"
        "401":
          $ref: "#/components/responses/NoAutorizado"
    post:
      operationId: prepararReserva
      summary: Prepara una instancia efímera
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudPreparar"
      responses:
        "201":
          description: Reserva preparada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRecibo"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}:
    get:
      operationId: consultarReserva
      summary: Obtiene un recibo persistido
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      responses:
        "200":
          description: Recibo de la reserva
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaRecibo"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/acceso:
    get:
      operationId: consultarAcceso
      summary: Obtiene el punto de acceso sin credenciales
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      responses:
        "200":
          description: Punto de acceso observado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaAcceso"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/diagnostico-acceso:
    get:
      operationId: diagnosticarAccesoReserva
      summary: Diagnostica el acceso sin publicar datos de red o libvirt
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      responses:
        "200":
          description: Comprobaciones saneadas de acceso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDiagnosticoAcceso"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/diagnostico-arranque:
    get:
      operationId: diagnosticarArranqueReserva
      summary: Diagnostica el arranque sin mutar ni publicar recursos internos
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      responses:
        "200":
          description: Comprobaciones y último fallo de arranque saneados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RespuestaDiagnosticoArranque"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/iniciar:
    post:
      operationId: iniciarReserva
      summary: Inicia la instancia apagada
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/detener:
    post:
      operationId: detenerReserva
      summary: Solicita el apagado cooperativo
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/reconciliar:
    post:
      operationId: reconciliarReserva
      summary: Repara una interrupción inequívoca
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/proteger-resultados:
    post:
      operationId: protegerResultados
      summary: Verifica y sella los resultados copiados
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/fallar:
    post:
      operationId: marcarReservaFallida
      summary: Registra un motivo de fallo tipado
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudFallo"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/descartar:
    post:
      operationId: descartarReserva
      summary: Retira una reserva con resultados protegidos
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/descartar-fallida:
    post:
      operationId: descartarReservaFallida
      summary: Retira una reserva fallida aceptando la pérdida
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudDescarteFallido"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/preparacion/sanear:
    post:
      operationId: sanearCandidataPlantilla
      summary: Retira medios y restaura la red exactos del inventario
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudSanearPlantilla"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/preparacion/iniciar-ciclo:
    post:
      operationId: iniciarCicloPlantilla
      summary: Inicia el siguiente ciclo de aceptación de plantilla
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/preparacion/detener-ciclo:
    post:
      operationId: detenerCicloPlantilla
      summary: Solicita el apagado cooperativo del ciclo actual
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/preparacion/validar-ciclo:
    post:
      operationId: validarCicloPlantilla
      summary: Observa y registra el ciclo detenido
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
  /api/v1/reservas/{id}/preparacion/promover:
    post:
      operationId: promoverPlantilla
      summary: Promueve una candidata validada sin reemplazar el origen
      parameters:
        - $ref: "#/components/parameters/IdEjecucion"
      requestBody:
        $ref: "#/components/requestBodies/Confirmacion"
      responses:
        "200":
          $ref: "#/components/responses/ReciboCorrecto"
        "400":
          $ref: "#/components/responses/SolicitudNoValida"
        "401":
          $ref: "#/components/responses/NoAutorizado"
        "409":
          $ref: "#/components/responses/OperacionRechazada"
components:
  securitySchemes:
    tokenPortador:
      type: http
      scheme: bearer
      bearerFormat: token opaco
  parameters:
    IdPlantilla:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identificador"
    IdEjecucion:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Identificador"
  requestBodies:
    Confirmacion:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SolicitudConfirmacion"
  responses:
    ReciboCorrecto:
      description: Transición completada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RespuestaRecibo"
    SolicitudNoValida:
      description: Solicitud no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NoAutorizado:
      description: Autenticación no válida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    OperacionRechazada:
      description: Precondición o transición rechazada
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Identificador:
      type: string
      minLength: 3
      maxLength: 64
      pattern: "^[a-z0-9][a-z0-9-]{2,63}$"
    Salud:
      type: object
      additionalProperties: false
      required: [estado, version]
      properties:
        estado:
          const: disponible
        version:
          type: string
    SistemaInvitado:
      type: string
      enum: [windows, linux]
    PoliticaRed:
      type: string
      enum: [sin_red, aislada]
    ProtocoloAcceso:
      type: string
      enum: [ssh, winrm_https, agente_https]
    CanalAcceso:
      type: object
      additionalProperties: false
      required: [protocolo, puerto]
      properties:
        protocolo:
          $ref: "#/components/schemas/ProtocoloAcceso"
        puerto:
          type: integer
          minimum: 1
          maximum: 65535
    Plantilla:
      type: object
      additionalProperties: false
      required: [id, sistema, politica_red, canal_acceso, capacidades]
      properties:
        id:
          $ref: "#/components/schemas/Identificador"
        sistema:
          $ref: "#/components/schemas/SistemaInvitado"
        politica_red:
          $ref: "#/components/schemas/PoliticaRed"
        canal_acceso:
          oneOf:
            - $ref: "#/components/schemas/CanalAcceso"
            - type: "null"
        capacidades:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identificador"
    EstadoReserva:
      type: string
      enum:
        - preparada
        - en_ejecucion
        - detenida
        - resultados_protegidos
        - fallida
        - promovida
        - descartada
    MotivoFallo:
      type: string
      enum:
        - infraestructura
        - carga_trabajo
        - cancelada
        - resultados_irrecuperables
    ResultadosProtegidos:
      type: object
      additionalProperties: false
      required: [sha256_manifiesto, artefactos, bytes]
      properties:
        sha256_manifiesto:
          type: string
          pattern: "^[A-Fa-f0-9]{64}$"
        artefactos:
          type: integer
          minimum: 1
        bytes:
          type: integer
          minimum: 0
    Recibo:
      type: object
      additionalProperties: false
      required:
        - version
        - revision
        - id_ejecucion
        - id_plantilla
        - id_instancia
        - sistema
        - estado
        - creado_en_unix_ms
        - actualizado_en_unix_ms
        - resultados
        - motivo_fallo
        - preparacion_plantilla
      properties:
        version:
          const: 1
        revision:
          type: integer
          minimum: 0
        id_ejecucion:
          $ref: "#/components/schemas/Identificador"
        id_plantilla:
          $ref: "#/components/schemas/Identificador"
        id_instancia:
          $ref: "#/components/schemas/Identificador"
        sistema:
          $ref: "#/components/schemas/SistemaInvitado"
        estado:
          $ref: "#/components/schemas/EstadoReserva"
        creado_en_unix_ms:
          type: integer
          minimum: 0
        actualizado_en_unix_ms:
          type: integer
          minimum: 0
        resultados:
          oneOf:
            - $ref: "#/components/schemas/ResultadosProtegidos"
            - type: "null"
        motivo_fallo:
          oneOf:
            - $ref: "#/components/schemas/MotivoFallo"
            - type: "null"
        preparacion_plantilla:
          oneOf:
            - $ref: "#/components/schemas/ProgresoPreparacionPlantilla"
            - type: "null"
    DestinoPromocion:
      type: object
      additionalProperties: false
      required: [plantilla, id_origen]
      properties:
        plantilla:
          $ref: "#/components/schemas/Plantilla"
        id_origen:
          $ref: "#/components/schemas/Identificador"
    FasePreparacionPlantilla:
      type: string
      enum:
        - saneada
        - ciclo_uno_en_curso
        - ciclo_uno_validado
        - ciclo_dos_en_curso
        - ciclo_dos_validado
        - promocion_en_curso
        - promovida
    CodigoComprobacionCandidata:
      type: string
      enum:
        - candidata_apagada
        - sin_medios_temporales
        - red_final_conforme
        - disco_sistema_unico
        - identidad_independiente
    ComprobacionCandidata:
      type: object
      additionalProperties: false
      required: [codigo, correcta]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoComprobacionCandidata"
        correcta:
          type: boolean
    ComprobacionIdentidadSsh:
      type: object
      additionalProperties: false
      required: [aplicable, correcta, observada_en_unix_ms, huella_sha256]
      oneOf:
        - properties:
            aplicable:
              const: false
            correcta:
              const: false
            observada_en_unix_ms:
              type: "null"
            huella_sha256:
              type: "null"
        - properties:
            aplicable:
              const: true
            correcta:
              const: true
            observada_en_unix_ms:
              type: integer
              minimum: 0
            huella_sha256:
              type: string
              pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
      properties:
        aplicable:
          type: boolean
        correcta:
          type: boolean
        observada_en_unix_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        huella_sha256:
          oneOf:
            - type: string
              pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
            - type: "null"
    ValidacionCicloPlantilla:
      type: object
      additionalProperties: false
      required:
        - numero
        - iniciada_en_unix_ms
        - detenida_en_unix_ms
        - validada_en_unix_ms
        - identidad_ssh
        - comprobaciones
      properties:
        numero:
          type: integer
          minimum: 1
          maximum: 2
        iniciada_en_unix_ms:
          type: integer
          minimum: 0
        detenida_en_unix_ms:
          type: integer
          minimum: 0
        validada_en_unix_ms:
          type: integer
          minimum: 0
        identidad_ssh:
          $ref: "#/components/schemas/ComprobacionIdentidadSsh"
        comprobaciones:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: "#/components/schemas/ComprobacionCandidata"
    ProgresoPreparacionPlantilla:
      type: object
      additionalProperties: false
      required:
        - id_plantilla_destino
        - fase
        - ciclos_validados
        - ciclo_iniciado_en_unix_ms
        - ciclo_detenido_en_unix_ms
        - identidad_ssh_en_curso
      properties:
        id_plantilla_destino:
          $ref: "#/components/schemas/Identificador"
        fase:
          $ref: "#/components/schemas/FasePreparacionPlantilla"
        ciclos_validados:
          type: array
          maxItems: 2
          items:
            $ref: "#/components/schemas/ValidacionCicloPlantilla"
        ciclo_iniciado_en_unix_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        ciclo_detenido_en_unix_ms:
          oneOf:
            - type: integer
              minimum: 0
            - type: "null"
        identidad_ssh_en_curso:
          oneOf:
            - $ref: "#/components/schemas/ComprobacionIdentidadSsh"
            - type: "null"
    CodigoComprobacion:
      type: string
      enum:
        - plantilla_apagada
        - sin_estado_guardado
        - identidad_registrada
        - disco_sistema_unico
        - formato_incremental_compatible
        - origen_registrado
        - red_conforme
    Comprobacion:
      type: object
      additionalProperties: false
      required: [codigo, correcta]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoComprobacion"
        correcta:
          type: boolean
    Diagnostico:
      type: object
      additionalProperties: false
      required: [preparada, comprobaciones]
      properties:
        preparada:
          type: boolean
        comprobaciones:
          type: array
          items:
            $ref: "#/components/schemas/Comprobacion"
    CodigoComprobacionAcceso:
      type: string
      enum:
        - reserva_en_ejecucion
        - instancia_encendida
        - direccion_observable
        - direccion_lease_observable
        - direccion_agente_observable
        - direccion_arp_observable
        - qga_disponible
        - marca_uuid_presente
        - marca_uuid_coincidente
        - clave_servidor_ssh_presente
        - clave_servidor_ssh_valida
    ComprobacionAcceso:
      type: object
      additionalProperties: false
      required: [codigo, aplicable, bloqueante, correcta]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoComprobacionAcceso"
        aplicable:
          type: boolean
        bloqueante:
          type: boolean
        correcta:
          type: boolean
    DiagnosticoAcceso:
      type: object
      additionalProperties: false
      required: [preparado, comprobaciones]
      properties:
        preparado:
          type: boolean
        comprobaciones:
          type: array
          minItems: 11
          maxItems: 11
          items:
            $ref: "#/components/schemas/ComprobacionAcceso"
    CodigoComprobacionArranque:
      type: string
      enum:
        - reserva_iniciable
        - instancia_registrada
        - instancia_apagada
        - definicion_valida
        - almacenamiento_presente
        - recursos_escritura_disponibles
        - redes_requeridas_activas
        - estado_guardado_ausente
    CodigoFalloArranque:
      type: string
      enum:
        - bloqueo_escritura_recurso
        - permiso_recurso_denegado
        - recurso_requerido_ausente
        - red_requerida_inactiva
        - firmware_no_disponible
        - tpm_no_disponible
        - espacio_insuficiente
        - configuracion_no_admitida
        - no_clasificado
    ComprobacionArranque:
      type: object
      additionalProperties: false
      required: [codigo, correcta]
      properties:
        codigo:
          $ref: "#/components/schemas/CodigoComprobacionArranque"
        correcta:
          type: boolean
    DiagnosticoArranque:
      type: object
      additionalProperties: false
      required: [iniciable, ultimo_fallo, ultimo_estado_fallido, comprobaciones]
      properties:
        iniciable:
          type: boolean
        ultimo_fallo:
          oneOf:
            - $ref: "#/components/schemas/CodigoFalloArranque"
            - type: "null"
        ultimo_estado_fallido:
          type: boolean
        comprobaciones:
          type: array
          minItems: 8
          maxItems: 8
          items:
            $ref: "#/components/schemas/ComprobacionArranque"
    PuntoAcceso:
      type: object
      additionalProperties: false
      required: [protocolo, direccion, puerto, identidad_servidor]
      properties:
        protocolo:
          $ref: "#/components/schemas/ProtocoloAcceso"
        direccion:
          type: string
          format: ip
        puerto:
          type: integer
          minimum: 1
          maximum: 65535
        identidad_servidor:
          oneOf:
            - $ref: "#/components/schemas/IdentidadServidor"
            - type: "null"
    IdentidadServidor:
      type: object
      additionalProperties: false
      required: [algoritmo, clave_publica, huella_sha256]
      properties:
        algoritmo:
          const: ssh-ed25519
        clave_publica:
          type: string
          minLength: 80
          maxLength: 80
          pattern: "^ssh-ed25519 [A-Za-z0-9+/]{68}$"
        huella_sha256:
          type: string
          pattern: "^SHA256:[A-Za-z0-9+/]{43}$"
    SolicitudPreparar:
      type: object
      additionalProperties: false
      required: [id_plantilla, id_ejecucion, confirmacion]
      properties:
        id_plantilla:
          $ref: "#/components/schemas/Identificador"
        id_ejecucion:
          $ref: "#/components/schemas/Identificador"
        confirmacion:
          $ref: "#/components/schemas/Identificador"
    SolicitudConfirmacion:
      type: object
      additionalProperties: false
      required: [confirmacion]
      properties:
        confirmacion:
          $ref: "#/components/schemas/Identificador"
    SolicitudSanearPlantilla:
      type: object
      additionalProperties: false
      required: [id_destino, confirmacion]
      properties:
        id_destino:
          $ref: "#/components/schemas/Identificador"
        confirmacion:
          $ref: "#/components/schemas/Identificador"
    SolicitudFallo:
      type: object
      additionalProperties: false
      required: [motivo, confirmacion]
      properties:
        motivo:
          $ref: "#/components/schemas/MotivoFallo"
        confirmacion:
          $ref: "#/components/schemas/Identificador"
    SolicitudDescarteFallido:
      type: object
      additionalProperties: false
      required: [acepta_perdida_resultados, confirmacion]
      properties:
        acepta_perdida_resultados:
          const: true
        confirmacion:
          $ref: "#/components/schemas/Identificador"
    RespuestaPlantillas:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: plantillas
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Plantilla"
    RespuestaReservas:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: reservas
        datos:
          type: array
          items:
            $ref: "#/components/schemas/Recibo"
    RespuestaDestinosPromocion:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: destinos_promocion
        datos:
          type: array
          items:
            $ref: "#/components/schemas/DestinoPromocion"
    RespuestaRecibo:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: recibo
        datos:
          $ref: "#/components/schemas/Recibo"
    RespuestaDiagnostico:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: diagnostico
        datos:
          $ref: "#/components/schemas/Diagnostico"
    RespuestaAcceso:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: acceso
        datos:
          $ref: "#/components/schemas/PuntoAcceso"
    RespuestaDiagnosticoAcceso:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: diagnostico_acceso
        datos:
          $ref: "#/components/schemas/DiagnosticoAcceso"
    RespuestaDiagnosticoArranque:
      type: object
      additionalProperties: false
      required: [tipo, datos]
      properties:
        tipo:
          const: diagnostico_arranque
        datos:
          $ref: "#/components/schemas/DiagnosticoArranque"
    Error:
      type: object
      additionalProperties: false
      required: [codigo, mensaje]
      properties:
        codigo:
          type: string
        mensaje:
          type: string
